components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth 액세스 토큰. 관리자 API는 role=ADMIN 필요. # TODO: 확인 필요 (토큰 전달 방식: Authorization 헤더 vs 쿠키 세션)

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AnswerId:
      name: answerId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ExamId:
      name: examId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ExamItemId:
      name: examItemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PlanItemId:
      name: planItemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ExpressionId:
      name: expressionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TargetGrade:
      name: targetGrade
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Grade' }

  responses:
    BadRequest:
      description: 요청 파라미터 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 인증 토큰 없음/만료
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 리소스 없음(타인 데이터 접근 포함)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 상태 충돌(중복, 진행 중 작업 등)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 요청 한도 초과(일일 AI 사용 한도 등)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }

    PageMeta:
      type: object
      required: [page, size, totalCount]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalCount: { type: integer, format: int64 }

    Grade:
      type: string
      enum: [NL, NM, NH, IL, IM1, IM2, IM3, IH, AL]
    QuestionType:
      type: string
      enum: [DESCRIBE, ROUTINE, PAST_EXP, ROLE_PLAY, COMPARE, UNEXPECTED, ISSUE]
    QuestionStatus:
      type: string
      enum: [DRAFT, PUBLISHED, HIDDEN]
    AnswerType:
      type: string
      enum: [VOICE, TEXT]
    AnswerStatus:
      type: string
      enum: [SUBMITTED, TRANSCRIBED, SCORED, FAILED]
    ExamStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ABANDONED]
    PlanItemType:
      type: string
      enum: [QUESTION, MOCK, REVIEW]
    ReviewRating:
      type: string
      enum: [HARD, NORMAL, EASY]

    # ── 인증/회원 ──
    SignUpRequest:
      type: object
      required: [email, password, nickname, termsAgreed]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 } # TODO: 확인 필요 (비밀번호 정책)
        nickname: { type: string, maxLength: 50 }
        termsAgreed: { type: boolean, description: 이용약관 동의(필수) }
        voiceConsent: { type: boolean, description: 음성 데이터 수집·이용 동의(음성 답변 이용 시 필요) }
    SignUpResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        emailVerificationRequired: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    AuthSession:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: 만료까지 초 }
        profileCompleted:
          type: boolean
          description: false이면 학습 프로필 설정 화면으로 이동
    UserProfile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        nickname: { type: string }
        role: { type: string, enum: [LEARNER, ADMIN] }
        targetGrade: { $ref: '#/components/schemas/Grade' }
        currentGrade: { $ref: '#/components/schemas/Grade' }
        examDate: { type: string, format: date, nullable: true }
        topicIds:
          type: array
          items: { type: integer, format: int64 }
        voiceConsent: { type: boolean }
    ProfileUpdateRequest:
      type: object
      required: [targetGrade]
      properties:
        targetGrade: { $ref: '#/components/schemas/Grade' }
        currentGrade: { $ref: '#/components/schemas/Grade' }
        examDate: { type: string, format: date, nullable: true, description: 과거 날짜 불가 }
        topicIds:
          type: array
          items: { type: integer, format: int64 }
    AiUsage:
      type: object
      properties:
        usageDate: { type: string, format: date }
        callCount: { type: integer }
        dailyLimit: { type: integer } # TODO: 확인 필요 (한도 값)
    StudyStats:
      type: object
      properties:
        totalStudyMinutes: { type: integer }
        answerCount: { type: integer }
        targetGrade: { $ref: '#/components/schemas/Grade' }
        latestEstimatedGrade: { $ref: '#/components/schemas/Grade' }
        scoreTrend:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              fluency: { type: number }
              vocabulary: { type: number }
              grammar: { type: number }
              content: { type: number }
        weakAreas:
          type: array
          items:
            type: object
            properties:
              area: { type: string, enum: [FLUENCY, VOCABULARY, GRAMMAR, CONTENT] }
              averageScore: { type: number }

    # ── 콘텐츠 ──
    Topic:
      type: object
      properties:
        topicId: { type: integer, format: int64 }
        topicName: { type: string }
    QuestionSummary:
      type: object
      properties:
        questionId: { type: integer, format: int64 }
        topicId: { type: integer, format: int64 }
        topicName: { type: string }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { type: integer }
        questionText: { type: string }
        answered: { type: boolean, description: 내가 답변한 적 있는지 }
    Question:
      allOf:
        - $ref: '#/components/schemas/QuestionSummary'
        - type: object
          properties:
            audioUrl:
              type: string
              nullable: true
              description: 질문 음성 URL. null이면 TTS로 대체 # TODO: 확인 필요 (IR-003 방식)
    QuestionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/QuestionSummary' }
    ModelAnswer:
      type: object
      properties:
        questionId: { type: integer, format: int64 }
        targetGrade: { $ref: '#/components/schemas/Grade' }
        scriptText: { type: string }
        keyExpressionNote: { type: string, nullable: true }
    AdminQuestion:
      allOf:
        - $ref: '#/components/schemas/Question'
        - type: object
          properties:
            status: { $ref: '#/components/schemas/QuestionStatus' }
            modelAnswers:
              type: array
              items: { $ref: '#/components/schemas/ModelAnswer' }
    AdminQuestionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminQuestion' }
    QuestionUpsertRequest:
      type: object
      required: [topicId, questionType, difficulty, questionText]
      properties:
        topicId: { type: integer, format: int64 }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { type: integer, minimum: 1, maximum: 6 }
        questionText: { type: string }
        status: { $ref: '#/components/schemas/QuestionStatus' }
    Expression:
      type: object
      properties:
        expressionId: { type: integer, format: int64 }
        topicId: { type: integer, format: int64, nullable: true }
        expressionText: { type: string }
        meaning: { type: string }
        exampleText: { type: string, nullable: true }
    ExpressionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Expression' }
    ExpressionUpsertRequest:
      type: object
      required: [expressionText, meaning]
      properties:
        topicId: { type: integer, format: int64, nullable: true }
        expressionText: { type: string, maxLength: 300 }
        meaning: { type: string, maxLength: 500 }
        exampleText: { type: string }

    # ── 답변/피드백 ──
    SubmitAnswerRequest:
      type: object
      required: [questionId, answerType]
      properties:
        questionId: { type: integer, format: int64 }
        answerType: { $ref: '#/components/schemas/AnswerType' }
        audio:
          type: string
          format: binary
          description: answerType=VOICE일 때 필수. 녹음 파일 # TODO: 확인 필요 (허용 포맷·최대 길이)
        text:
          type: string
          description: answerType=TEXT일 때 필수
        durationSec: { type: integer }
    SubmitExamAnswerRequest:
      type: object
      required: [answerType]
      properties:
        answerType: { $ref: '#/components/schemas/AnswerType' }
        audio: { type: string, format: binary }
        text: { type: string }
        durationSec: { type: integer }
    Answer:
      type: object
      properties:
        answerId: { type: integer, format: int64 }
        questionId: { type: integer, format: int64 }
        answerType: { $ref: '#/components/schemas/AnswerType' }
        audioUrl:
          type: string
          nullable: true
          description: 서명된 임시 URL. 음성 삭제 후 null
        transcriptText: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/AnswerStatus' }
        durationSec: { type: integer, nullable: true }
        submittedAt: { type: string, format: date-time }
        hasFeedback: { type: boolean }
        estimatedGrade:
          allOf:
            - $ref: '#/components/schemas/Grade'
          nullable: true
    AnswerPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Answer' }
    Feedback:
      type: object
      properties:
        feedbackId: { type: integer, format: int64 }
        answerId: { type: integer, format: int64 }
        estimatedGrade: { $ref: '#/components/schemas/Grade' }
        fluencyScore: { type: integer, minimum: 0, maximum: 100 }
        vocabularyScore: { type: integer, minimum: 0, maximum: 100 }
        grammarScore: { type: integer, minimum: 0, maximum: 100 }
        contentScore: { type: integer, minimum: 0, maximum: 100 }
        commentText: { type: string }
        correctedText: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # ── 모의고사 ──
    MockExamItem:
      type: object
      properties:
        examItemId: { type: integer, format: int64 }
        seqNo: { type: integer }
        question: { $ref: '#/components/schemas/Question' }
        answerId: { type: integer, format: int64, nullable: true }
        skipped: { type: boolean }
    MockExam:
      type: object
      properties:
        examId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/ExamStatus' }
        questionCount: { type: integer }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        overallGrade:
          allOf:
            - $ref: '#/components/schemas/Grade'
          nullable: true
        items:
          type: array
          items: { $ref: '#/components/schemas/MockExamItem' }
    MockExamPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/MockExam' }

    # ── 학습 계획 ──
    StudyPlanItem:
      type: object
      properties:
        planItemId: { type: integer, format: int64 }
        planDate: { type: string, format: date }
        itemType: { $ref: '#/components/schemas/PlanItemType' }
        questionId: { type: integer, format: int64, nullable: true }
        done: { type: boolean }
        doneAt: { type: string, format: date-time, nullable: true }
    StudyPlan:
      type: object
      properties:
        planId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        weeklyMinutes: { type: integer }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        items:
          type: array
          items: { $ref: '#/components/schemas/StudyPlanItem' }

    # ── 복습 ──
    ExpressionCard:
      type: object
      properties:
        cardId: { type: integer, format: int64 }
        expressionId: { type: integer, format: int64, nullable: true }
        expressionText: { type: string }
        meaning: { type: string }
        memo: { type: string, nullable: true }
        intervalDays: { type: integer }
        nextReviewAt: { type: string, format: date-time, nullable: true }
        lastReviewedAt: { type: string, format: date-time, nullable: true }
        reviewCount: { type: integer }
    ExpressionCardPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ExpressionCard' }
    ExpressionCardCreateRequest:
      type: object
      properties:
        expressionId: { type: integer, format: int64 }
        expressionText: { type: string, maxLength: 300 }
        meaning: { type: string, maxLength: 500 }
        memo: { type: string }
      description: expressionId 또는 (expressionText + meaning) 중 하나 필수
