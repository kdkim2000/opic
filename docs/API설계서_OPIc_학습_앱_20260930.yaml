openapi: 3.0.3
info:
  title: OPIc 학습 앱 API
  version: 0.1.0
  description: |
    유즈케이스 기반 API 설계서 초안.
    - 기준 문서: 유즈케이스_OPIc_학습_앱_20260930.md, 화면목록_OPIc_학습_앱_20260930.md, 서비스분류_OPIc_학습_앱_20260930.md, 데이터설계서_OPIc_학습_앱_20260930.md
    - 구현: Next.js Route Handler (/api/v1). 인증은 Supabase Auth JWT.
    - x-uc: 연계 유즈케이스, x-release: v1.0(MVP) / v1.1 / v2.0
    - 페이지네이션은 Offset 방식(page 1부터, size 기본 20, 최대 100).
servers:
  # TODO: 확인 필요 (배포 도메인 확정 후 교체)
  - url: http://localhost:3000/api/v1
    description: 개발 서버
tags:
  - name: 인증
    description: SC-001 회원관리서비스. Supabase Auth 래핑
  - name: 회원
    description: SC-001 회원관리서비스 / SC-005 학습관리서비스(통계)
  - name: 콘텐츠
    description: SC-002 콘텐츠서비스
  - name: 답변
    description: SC-003 답변연습서비스
  - name: 피드백
    description: SC-004 AI피드백서비스
  - name: 모의고사
    description: SC-003 답변연습서비스 (v1.1)
  - name: 학습계획
    description: SC-005 학습관리서비스 (v1.1)
  - name: 복습
    description: SC-006 복습서비스 (v2.0)
  - name: 관리자
    description: SC-002 콘텐츠서비스 관리자 기능 (v2.0, role=ADMIN)
security:
  - bearerAuth: []

paths:
  # ───────────── 인증 ─────────────
  /auth/signup:
    post:
      tags: [인증]
      operationId: signUp
      summary: 회원 가입
      x-uc: [UC-001]
      x-release: v1.0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '201':
          description: 가입 완료(이메일 인증 메일 발송)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignUpResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/login:
    post:
      tags: [인증]
      operationId: login
      summary: 로그인
      x-uc: [UC-002]
      x-release: v1.0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 이메일 미인증 계정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' } # TODO: 확인 필요 (로그인 실패 제한 횟수·시간)
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/logout:
    post:
      tags: [인증]
      operationId: logout
      summary: 로그아웃
      x-uc: [UC-002]
      x-release: v1.0
      responses:
        '204': { description: 로그아웃 완료 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/password-reset:
    post:
      tags: [인증]
      operationId: requestPasswordReset
      summary: 비밀번호 재설정 메일 요청
      description: 계정 존재 여부를 노출하지 않기 위해 항상 202를 반환한다.
      x-uc: [UC-002]
      x-release: v1.0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { description: 요청 접수 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/verification-email:
    post:
      tags: [인증]
      operationId: resendVerificationEmail
      summary: 인증 메일 재발송
      x-uc: [UC-001, UC-002]
      x-release: v1.0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { description: 요청 접수 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────── 회원 ─────────────
  /users/me:
    get:
      tags: [회원]
      operationId: getMyProfile
      summary: 내 프로필 조회
      x-uc: [UC-002, UC-003]
      x-release: v1.0
      responses:
        '200':
          description: 내 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /users/me/profile:
    put:
      tags: [회원]
      operationId: updateMyProfile
      summary: 학습 프로필 설정·수정
      x-uc: [UC-003]
      x-release: v1.0
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: 저장된 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /users/me/ai-usage:
    get:
      tags: [회원]
      operationId: getMyAiUsage
      summary: 오늘의 AI 사용량·한도 조회
      x-uc: [UC-005, UC-006]
      x-release: v1.0
      responses:
        '200':
          description: 일일 사용량
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /users/me/stats:
    get:
      tags: [회원]
      operationId: getMyStats
      summary: 진도·성취 통계 조회
      x-uc: [UC-012]
      x-release: v1.1
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 통계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────── 콘텐츠 ─────────────
  /topics:
    get:
      tags: [콘텐츠]
      operationId: listTopics
      summary: 주제 목록 조회
      x-uc: [UC-003, UC-004]
      x-release: v1.0
      responses:
        '200':
          description: 주제 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Topic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /questions:
    get:
      tags: [콘텐츠]
      operationId: listQuestions
      summary: 질문 검색·조회
      description: 공개(PUBLISHED) 질문만 반환한다. topicId 미지정 시 프로필 관심 주제를 기본 적용할지는 클라이언트가 결정한다.
      x-uc: [UC-004]
      x-release: v1.0
      parameters:
        - name: topicId
          in: query
          schema: { type: integer, format: int64 }
        - name: questionType
          in: query
          schema: { $ref: '#/components/schemas/QuestionType' }
        - name: difficulty
          in: query
          schema: { type: integer, minimum: 1, maximum: 6 } # TODO: 확인 필요 (난이도 체계)
        - name: answered
          in: query
          description: true=답변한 질문, false=미답변 질문
          schema: { type: boolean }
        - name: keyword
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 질문 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /questions/{questionId}:
    get:
      tags: [콘텐츠]
      operationId: getQuestion
      summary: 질문 상세 조회
      x-uc: [UC-005]
      x-release: v1.0
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: 질문 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /questions/{questionId}/model-answers:
    get:
      tags: [콘텐츠]
      operationId: listModelAnswers
      summary: 모범 답안 조회
      x-uc: [UC-007]
      x-release: v1.0
      parameters:
        - $ref: '#/components/parameters/QuestionId'
        - name: targetGrade
          in: query
          description: 미지정 시 내 목표 등급 기준
          schema: { $ref: '#/components/schemas/Grade' }
      responses:
        '200':
          description: 모범 답안 목록(미등록 시 빈 배열)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ModelAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────── 답변 ─────────────
  /answers:
    post:
      tags: [답변]
      operationId: submitAnswer
      summary: 질문 답변 제출
      description: |
        음성(audio) 또는 텍스트(text)로 답변을 제출한다. 저장 후 전사(STT)·AI 채점이 비동기로 진행되며
        진행 상태는 GET /answers/{answerId}의 status로 확인한다. 음성 제출은 음성 수집 동의(voiceConsent)가 필요하다.
      x-uc: [UC-005, UC-006]
      x-release: v1.0
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SubmitAnswerRequest' }
      responses:
        '201':
          description: 답변 접수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Answer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 음성 수집 미동의
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: 녹음 길이/파일 크기 초과 # TODO: 확인 필요 (최대 녹음 시간)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [답변]
      operationId: listMyAnswers
      summary: 내 답변 이력 조회
      x-uc: [UC-006, UC-014]
      x-release: v1.0
      parameters:
        - name: questionId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 답변 이력
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [답변]
      operationId: deleteMyAnswers
      summary: 답변·녹음 다건/전체 삭제
      description: ids(선택 삭제) 또는 all=true(전체 삭제) 중 하나를 지정한다. 음성 파일과 전사·피드백이 함께 삭제된다.
      x-uc: [UC-014]
      x-release: v1.0
      parameters:
        - name: ids
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { type: integer, format: int64 }
        - name: all
          in: query
          schema: { type: boolean }
      responses:
        '204': { description: 삭제 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /answers/{answerId}:
    get:
      tags: [답변]
      operationId: getAnswer
      summary: 답변 상세·처리 상태 조회
      description: 채점 진행 상태 폴링에 사용한다. 본인 답변만 조회 가능하다.
      x-uc: [UC-005, UC-006]
      x-release: v1.0
      parameters:
        - $ref: '#/components/parameters/AnswerId'
      responses:
        '200':
          description: 답변 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Answer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [답변]
      operationId: deleteAnswer
      summary: 답변·녹음 단건 삭제
      x-uc: [UC-014]
      x-release: v1.0
      parameters:
        - $ref: '#/components/parameters/AnswerId'
      responses:
        '204': { description: 삭제 완료 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────── 피드백 ─────────────
  /answers/{answerId}/feedback:
    get:
      tags: [피드백]
      operationId: getFeedback
      summary: AI 피드백 조회
      description: 채점 완료 전이면 404를 반환한다(진행 상태는 getAnswer의 status 참조).
      x-uc: [UC-006, UC-007]
      x-release: v1.0
      parameters:
        - $ref: '#/components/parameters/AnswerId'
      responses:
        '200':
          description: 피드백
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [피드백]
      operationId: requestFeedback
      summary: 재채점 요청
      description: 채점 실패 또는 재답변 후 재채점을 요청한다. 실패 건은 사용 횟수를 차감하지 않는다.
      x-uc: [UC-006]
      x-release: v1.0
      parameters:
        - $ref: '#/components/parameters/AnswerId'
      responses:
        '202': { description: 재채점 접수 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────── 모의고사 ─────────────
  /mock-exams:
    post:
      tags: [모의고사]
      operationId: createMockExam
      summary: 모의고사 시작(문항 구성)
      x-uc: [UC-008]
      x-release: v1.1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                questionCount:
                  type: integer
                  description: 미지정 시 기본 구성 # TODO: 확인 필요 (문항 구성 규칙)
      responses:
        '201':
          description: 구성된 모의고사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockExam' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [모의고사]
      operationId: listMockExams
      summary: 모의고사 이력 조회
      x-uc: [UC-008]
      x-release: v1.1
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 모의고사 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockExamPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /mock-exams/{examId}:
    get:
      tags: [모의고사]
      operationId: getMockExam
      summary: 모의고사 상세·결과·이어하기 조회
      x-uc: [UC-008]
      x-release: v1.1
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: 모의고사 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockExam' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [모의고사]
      operationId: updateMockExamStatus
      summary: 모의고사 종료·중단
      description: COMPLETED로 변경하면 전 문항 AI 채점과 종합 등급 산정이 시작된다.
      x-uc: [UC-008]
      x-release: v1.1
      parameters:
        - $ref: '#/components/parameters/ExamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [COMPLETED, ABANDONED]
      responses:
        '200':
          description: 변경된 모의고사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockExam' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /mock-exams/{examId}/items/{examItemId}:
    patch:
      tags: [모의고사]
      operationId: skipMockExamItem
      summary: 문항 건너뛰기
      x-uc: [UC-008]
      x-release: v1.1
      parameters:
        - $ref: '#/components/parameters/ExamId'
        - $ref: '#/components/parameters/ExamItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skipped]
              properties:
                skipped: { type: boolean }
      responses:
        '200':
          description: 변경된 문항
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockExamItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
